name: deepshield
description: "DeepShield: AI-Powered Digital Media Authenticity & Deepfake Detection Platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Local storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # UI
  google_fonts: ^8.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Scanning
  mobile_scanner: ^5.1.1
  file_picker: ^8.0.3
  image_picker: ^1.1.2

  # Utils
  equatable: ^2.0.5
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  url_launcher: ^6.2.6
  flutter_secure_storage: ^9.2.2
  fluttertoast: ^8.2.5
  uuid: ^4.4.0

  # Cupertino icons
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

  # App launcher icon generator
  flutter_launcher_icons: ^0.14.4

# --------------------------------------------------
# FLUTTER LAUNCHER ICON CONFIGURATION
# --------------------------------------------------

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

# --------------------------------------------------
# FLUTTER CONFIGURATION
# --------------------------------------------------

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Custom fonts
  #
  # fonts:
  #   - family: Satoshi
  #     fonts:
  #       - asset: assets/fonts/Satoshi-Regular.ttf
  #       - asset: assets/fonts/Satoshi-Bold.ttf
  #         weight: 700